# pixi project definition — the reproducible Python environment for the backend.
#
# This is the source of truth for the Python side (replacing manual conda envs +
# RTASOID_PYTHON). It pulls CUDA-enabled PyTorch, ffmpeg, and the native
# scientific stack from conda-forge into a project-local env at a deterministic
# path (.pixi/envs/default), which the Electron app auto-discovers.
#
#   pixi install        # materialize/pin the env (writes pixi.lock) + downloads
#   pixi run backend    # run the FastAPI backend standalone
#   pixi run test       # run the pytest suite
#
# CPU-only machine? Swap `pytorch-gpu` for `pytorch-cpu` below.

[workspace]
name = "realtimeasoid"
version = "0.1.0"
description = "Real-time clip-based animal behavior classifier (Electron GUI + FastAPI/PyTorch backend)."
channels = ["conda-forge"]
# The `cuda` virtual package tells the solver a CUDA-capable GPU/driver is present
# so it can pick a pytorch-gpu build (pixi won't assume this on its own, for
# lockfile portability). Add another entry (e.g. "linux-64") to support that
# platform too, then re-run `pixi install`.
platforms = [{ platform = "win-64", cuda = "12" }]

[tasks]
backend = "uvicorn backend.server:app --port 8741 --host 127.0.0.1"
test = "pytest"

[dependencies]
python = "3.12.*"
# Deep learning (CUDA build pulled from conda-forge — bundles the CUDA runtime,
# no separate CUDA toolkit install needed).
pytorch-gpu = "*"
torchvision = "*"
lightning = "*"
torchmetrics = "*"
timm = "*"
# Vision / video / numerics
opencv = "*"
albumentations = "*"
ffmpeg = "*"
numpy = "*"
pandas = "*"
scipy = "*"
h5py = "*"
matplotlib = "*"
# Backend / config / tuning / logging
fastapi = "*"
uvicorn = "*"
omegaconf = "*"
pyyaml = "*"
optuna = "*"
wandb = "*"
# Tests
pytest = "*"
pytest-asyncio = "*"
httpx = "*"
# Benchmarking (benchmarking/code/)
psutil = "*"
py-cpuinfo = "*"
tqdm = "*"

# albucore (an albumentations dependency) hard-imports simsimd, but conda-forge's
# win-64 `simsimd` build is an empty rename-shim (it points at a `numkong` package
# instead of shipping the `simsimd` module) — pull the real thing from PyPI.
[pypi-dependencies]
simsimd = "*"
