# pixi project definition — the reproducible Python environments for both the
# backend and the PySide6 frontend, in one lockfile.
#
# Two environments, solved independently so the GUI never drags in CUDA/torch:
#   default — the FastAPI/PyTorch backend (.pixi/envs/default)
#   gui     — the PySide6 desktop app (.pixi/envs/gui)
#
#   pixi install        # materialize/pin BOTH envs (writes pixi.lock) + downloads
#   pixi run gui         # launch the app
#   pixi run backend    # run the FastAPI backend standalone
#   pixi run test        # run the pytest suite
#
# GPU or not, `pixi install` picks the right build by itself: every platform is
# solved twice (with and without CUDA 12) and pixi installs the variant this
# machine supports — CUDA PyTorch with an NVIDIA driver >= CUDA 12, CPU otherwise.

[workspace]
name = "b-real"
version = "0.1.0"
description = "Real-time clip-based animal behavior classifier (PySide6 GUI + FastAPI/PyTorch backend)."
channels = ["conda-forge"]
# Order matters: pixi installs the FIRST entry this machine satisfies, so the
# CUDA variants come first and the plain ones are the no-GPU fallback.
platforms = [
  { name = "win-64-cuda", platform = "win-64", cuda = "12.0" },
  { name = "linux-64-cuda", platform = "linux-64", cuda = "12.0" },
  "win-64",
  "linux-64",
]   # add "osx-64" here too, then re-run `pixi install`

[dependencies]
# Shared by both environments — kept minimal so the gui environment stays
# free of CUDA/torch. Everything backend-specific lives under
# [feature.backend], everything gui-specific under [feature.gui].
python = "3.12.*"
numpy = "*"

[feature.backend]
[feature.backend.tasks]
backend = "uvicorn backend.server:app --port 8742 --host 127.0.0.1"
test = "pytest"

[feature.backend.dependencies]
# Deep learning. Plain `pytorch`, not `pytorch-gpu`: conda-forge has CUDA and
# CPU builds of it, and the solver takes the CUDA one (bundled CUDA runtime, no
# toolkit install needed) only on the CUDA platform variants above. Pinning
# pytorch-gpu made the env refuse to install on machines without CUDA 12.
pytorch = "*"
torchvision = "*"
lightning = "*"
torchmetrics = "*"
timm = "*"
# Vision / video / numerics
opencv = "*"
albumentations = "*"
ffmpeg = "*"
pandas = "*"
scipy = "*"
h5py = "*"
matplotlib = "*"
# Backend / config / tuning / logging
fastapi = "*"
uvicorn = "*"
omegaconf = "*"
pyyaml = "*"
optuna = "*"
wandb = "*"
moviepy = "*"  # wandb.Video from frames: the annotated test clips (wandb[media])
# Deployment-format export + latency measurement (see optimized_runtime.py).
# ONNX is the shared intermediate; OpenVINO serves the CPU target. The GPU
# target uses tensorrt-cu12, declared under [feature.backend.pypi-dependencies]
# below (it is not on conda-forge). A missing runtime fails loudly rather than
# falling back to TorchScript numbers that don't predict the frame budget.
onnx = "*"
openvino = "*"
# SAM2 (Hugging Face port, Apache-2.0) — the teacher for Train Localizer
# (sam2_track.py). Sam2VideoModel landed in 4.56. Weights download from the
# Hugging Face hub on first use.
transformers = ">=4.56"
# Tests
pytest = "*"
pytest-asyncio = "*"
httpx = "*"

# albucore (an albumentations dependency) imports simsimd unconditionally, but
# the conda-forge simsimd 7.7.0 win-64/py312 build ships an empty payload (a
# packaging bug upstream — its paths.json lists zero files), so `import
# albumentations` fails no matter what conda-forge version/pin is tried. simsimd
# is a pure C-extension leaf package with no system-library entanglements, so
# sourcing it from PyPI (where the wheel build is intact) sidesteps the bug.
[feature.backend.pypi-dependencies]
simsimd = "*"
# TensorRT: the GPU deployment runtime the tuning latency gate measures against
# (optimized_runtime.py). NVIDIA publishes it only to PyPI, not conda-forge, and
# pixi resolves pypi-dependencies itself (no system pip needed), so it goes
# here. The -cu12 variant matches the CUDA 12 runtime pytorch-gpu brings in;
# tensorrt-cu13 would load a second, conflicting CUDA into the same process.
tensorrt-cu12 = "*"
# On PyPI, tensorrt-cu12-libs is a "wheel-stub" sdist: building it downloads the
# real multi-GB wheel from NVIDIA mid-install, which fails on Windows. NVIDIA's
# own index has proper linux-64 and win-64 wheels, so the two binary parts come
# from there and the solver picks the right one per platform. (tensorrt-cu12
# itself is a tiny plain-setuptools sdist that only provides `import tensorrt`.)
tensorrt-cu12-libs = { version = "*", index = "https://pypi.nvidia.com" }
tensorrt-cu12-bindings = { version = "*", index = "https://pypi.nvidia.com" }
# NVDEC hardware video decoding for inference/preprocessing (video_decode.py).
# Optional at runtime: decoder="auto" falls back to cv2 if it's missing or the
# GPU has no NVDEC. Uses the driver's libnvcuvid and bundles its own demuxer.
PyNvVideoCodec = "*"

# The PySide6 desktop app. No torch, no CUDA — this environment installs (and
# solves) on a machine with no GPU at all, which matters for anyone running the
# GUI against a remote backend.
[feature.gui]
# The plain platforms only: the GUI never uses CUDA, and letting it solve for
# the CUDA variants too re-resolved it onto PySide6 6.11.2, which segfaults
# building the main window.
platforms = ["win-64", "linux-64"]

[feature.gui.tasks]
gui = "python gui/app.py"

[feature.gui.dependencies]
pyside6 = ">=6.7"
av = ">=12"   # PyAV: frame-accurate decode via ffmpeg/libav

[feature.gui.pypi-dependencies]
httpx = ">=0.27"
pyinstaller = "*"   # gui/packaging/ — desktop bundle build only

[environments]
default = { features = ["backend"] }
gui = { features = ["gui"] }
