# pixi project definition — the reproducible Python environment for the backend.
#
# This is the source of truth for the Python side (replacing manual conda envs +
# RTASOID_PYTHON). It pulls CUDA-enabled PyTorch, ffmpeg, and the native
# scientific stack from conda-forge into a project-local env at a deterministic
# path (.pixi/envs/default), which the Electron app auto-discovers.
#
#   pixi install        # materialize/pin the env (writes pixi.lock) + downloads
#   pixi run backend    # run the FastAPI backend standalone
#   pixi run test       # run the pytest suite
#
# CPU-only machine? Swap `pytorch-gpu` for `pytorch-cpu` below.

[project]
name = "realtimeasoid"
version = "0.1.0"
description = "Real-time clip-based animal behavior classifier (Electron GUI + FastAPI/PyTorch backend)."
channels = ["conda-forge"]
platforms = ["win-64"]   # add "linux-64" / "osx-64" here, then re-run `pixi install`

# Without this, pixi solves as if no CUDA is present (for lockfile portability),
# so pytorch-gpu can never be solved on any machine, GPU or not. 12.0 is a
# conservative floor compatible with recent drivers (raise if a newer
# pytorch-gpu build requires it; check `pixi info` for what your driver reports).
[system-requirements]
cuda = "12.0"

[tasks]
backend = "uvicorn backend.server:app --port 8742 --host 127.0.0.1"
test = "pytest"

[dependencies]
python = "3.12.*"
# Deep learning (CUDA build pulled from conda-forge — bundles the CUDA runtime,
# no separate CUDA toolkit install needed).
pytorch-gpu = "*"
torchvision = "*"
lightning = "*"
torchmetrics = "*"
timm = "*"
# Vision / video / numerics
opencv = "*"
albumentations = "*"
ffmpeg = "*"
numpy = "*"
pandas = "*"
scipy = "*"
h5py = "*"
matplotlib = "*"
# Backend / config / tuning / logging
fastapi = "*"
uvicorn = "*"
omegaconf = "*"
pyyaml = "*"
optuna = "*"
wandb = "*"
# Deployment-format export + latency measurement (see optimized_runtime.py).
# ONNX is the shared intermediate; OpenVINO serves the CPU target. The GPU
# target uses tensorrt-cu12, declared under [pypi-dependencies] below (it is not
# on conda-forge). A missing runtime fails loudly rather than falling back to
# TorchScript numbers that don't predict the frame budget.
onnx = "*"
openvino = "*"
# Tests
pytest = "*"
pytest-asyncio = "*"
httpx = "*"

# albucore (an albumentations dependency) imports simsimd unconditionally, but
# the conda-forge simsimd 7.7.0 win-64/py312 build ships an empty payload (a
# packaging bug upstream — its paths.json lists zero files), so `import
# albumentations` fails no matter what conda-forge version/pin is tried. simsimd
# is a pure C-extension leaf package with no system-library entanglements, so
# sourcing it from PyPI (where the wheel build is intact) sidesteps the bug.
[pypi-dependencies]
simsimd = "*"
# TensorRT: the GPU deployment runtime the tuning latency gate measures against
# (optimized_runtime.py). NVIDIA publishes it only to PyPI, not conda-forge, and
# the env has no pip — so it goes here, where pixi resolves it. The -cu12 variant
# matches the CUDA 12 runtime pytorch-gpu brings in; tensorrt-cu13 would load a
# second, conflicting CUDA into the same process.
tensorrt-cu12 = "*"
