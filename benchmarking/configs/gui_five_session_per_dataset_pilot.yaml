project_name: aeagle-yttri-lab
run_name: gui_five_session_per_dataset_pilot

max_epochs: 100
fine_tune_lr: false

model:
  num_frames: 3
  variant: b0
  shift_fraction: 0.125
  pretrained: true
  tsm_stages: [1, 2, 3, 4, 5, 6, 7]
  dropout: 0.2
  lr: 1e-4
  weight_decay: 1e-3
  lr_scheduler_t_max: 100
  temporal_pool: last

data:
  train_percent: 0.7
  val_percent: 0.15
  test_percent: 0.15
  shuffle: false
  # One contiguous chronological order per dataset, selected by exhaustive
  # search over all 6^5 combinations. Entries correspond to label_paths and
  # frame_dirs below in the same order.
  split_order_by_dataset:
    - [test, val, train]  # 6_10_reencoded
    - [test, train, val]  # 7_1_reencoded
    - [train, test, val]  # 7_16m_reencoded
    - [test, train, val]  # 7_16f_reencoded
    - [train, val, test]  # 7_17m_reencoded

callbacks:
  early_stopping_patience: 6

data_loading:
  label_paths:
    - D:/Realtime/realtime_app_output/labels/6_10_reencoded_bouts.csv
    - D:/Realtime/realtime_app_output/labels/7_1_reencoded_bouts.csv
    - D:/Realtime/realtime_app_output/labels/7_16m_reencoded_bouts.csv
    - D:/Realtime/realtime_app_output/labels/7_16f_reencoded_bouts.csv
    - D:/Realtime/realtime_app_output/labels/7_17m_reencoded_bouts.csv
  frame_dirs:
    - D:/Realtime/realtime_app_output/frames/6_10_reencoded
    - D:/Realtime/realtime_app_output/frames/7_1_reencoded
    - D:/Realtime/realtime_app_output/frames/7_16m_reencoded
    - D:/Realtime/realtime_app_output/frames/7_16f_reencoded
    - D:/Realtime/realtime_app_output/frames/7_17m_reencoded
  frames_per_group: 3
  label_union:
  binarize: face / head / paw groom

boundary_smoothing:
  enabled: true
  epsilon: 0.3
  window: 5
